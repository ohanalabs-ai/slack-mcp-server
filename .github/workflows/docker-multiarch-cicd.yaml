name: 🐳 docker-multiarch-cicd
run-name: 🐳 Docker Multi-Arch CICD PR ${{ github.event.pull_request.number }} commit ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

jobs:
  setup:
    name: 🔧 setup
    runs-on: ubuntu-latest
    outputs:
      dockerhub-token: ${{ steps.secrets.outputs.token }}
      dockerhub-username: ${{ steps.secrets.outputs.username }}
    steps:
      - name: Load secrets
        id: secrets
        run: |
          echo "username=${{ secrets.DOCKER_REGISTRY_USERNAME }}" >> "$GITHUB_OUTPUT"
          echo "token=${{ secrets.DOCKER_REGISTRY_TOKEN }}" >> "$GITHUB_OUTPUT"

  docker-multiarch:
    name: 🐳 docker
    needs: [ setup ]
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      docker-compose-file-name: docker-compose.yml
      dockerhub-registry: docker.io
      dockerhub-namespace: ${{ github.repository_owner }}
      dockerhub-registry-username: ${{ needs.setup.outputs.dockerhub-username }}
      dockerhub-registry-token: ${{ needs.setup.outputs.dockerhub-token }}
      push-attestations: "false"
